<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kacky Reloaded · TAS Project</title>
<meta name="description" content="Every Kacky Reloaded map (KR1–KR7): live world records from Trackmania.io against the best TAS runs from TMTAS Exchange.">
<link rel="preload" href="fonts/chakra-petch-latin-700-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="data/site.json?v=dev" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css?v=dev">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080c'/%3E%3Cpath d='M9 7h4v7l6-7h5l-7 8 7 10h-5l-5-7-1 1v6H9z' fill='%23c6ff3d'/%3E%3C/svg%3E">
<meta name="theme-color" content="#07080c">
</head>
<body>
<div class="grain"></div>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> Trackmania 2020 · Tool-assisted</div>
    <h1>KACKY<span class="slash">/</span><em>RELOADED</em></h1>
    <p class="sub">525 maps, KR1 through KR7. The best human world records against the best TAS runs.</p>
    <div class="stats" id="stats"></div>
    <a class="discord" href="https://discord.gg/VQ8gWQsDye" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.4C.6 9 -.2 13.6.2 18.1a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12 0l.5.4a12.8 12.8 0 0 1-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.7ZM8.5 15.4c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>
      Join the Discord
    </a>
  </div>
</header>

<nav class="bar">
  <div class="wrap bar-in">
    <div class="eds" id="eds"></div>
    <div class="parts" id="views"><button class="chip on" data-view="maps">Maps</button><button class="chip" data-view="stats">Stats</button><button class="chip" data-view="videos">Videos</button></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search #, name, author, runner…" autocomplete="off">
      <select id="filter">
        <option value="all">All maps</option>
        <option value="tas">Has TAS</option>
        <option value="none">No TAS yet</option>
        <option value="beat">TAS beats WR</option>
        <option value="behind">TAS slower than WR</option>
        <option value="Normal cut">Normal cuts</option>
        <option value="Uber">Ubers</option>
        <option value="Noseboost">Noseboosts</option>
        <option value="unrated">Not rated yet</option>
      </select>
      <select id="sort">
        <option value="id">Map #</option>
        <option value="gap">Biggest TAS gain</option>
        <option value="wr">WR time</option>
        <option value="recent">Recent WR</option>
      </select>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="latest" id="latest"></section>
  <div class="progress" id="progress"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No maps match.</p>
  <section id="statsView" hidden></section>
  <section id="videosView" hidden></section>
</main>

<dialog id="modal">
  <div class="m-in" id="m-body"></div>
</dialog>

<footer class="wrap foot">
  <span>WRs: <a href="https://trackmania.io/#/clubs/3074" target="_blank" rel="noopener">Trackmania.io</a> · TAS: <a href="https://tmtas.exchange" target="_blank" rel="noopener">TMTAS Exchange</a></span>
  <span><a href="https://discord.gg/VQ8gWQsDye" target="_blank" rel="noopener">Discord</a> · <span id="updated"></span></span>
</footer>

<script src="js/main.js?v=dev" type="module"></script>
</body>
</html>
