name: Check & test

# Runs on pull requests so changes are checked before they're merged.
# (Pushes to main are checked by the deploy job in update.yml.)
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run -s check
      - run: npm run -s lint
      - run: npm test
