name: Update data & deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Refresh WRs and TAS runs (slow, ~15 min). Untick to only extract inputs.'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  data:
    # Slow (Trackmania.io rate limits): only on schedule / manual runs
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch WRs (Trackmania.io) and TAS runs (TMTAS Exchange)
        if: github.event_name == 'schedule' || inputs.fetch
        run: node scripts/update.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract TAS inputs from replays (GBX.NET)
        run: dotnet run --project tools/extract -c Release -- data/tas.json data/inputs
      - name: Commit data
        run: |
          git config user.name "kacky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F' '%H:%M)"
          git pull --rebase origin main
          git push

  deploy:
    needs: data
    # runs right away on push; after the data job on schedule / manual runs
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache-bust assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
