name: Update data & deploy

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Refresh WRs and TAS runs. Untick to only extract inputs.'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  data:
    # Slow (Trackmania.io rate limits): only on schedule / manual runs
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      started: ${{ steps.t.outputs.started }}
    steps:
      - id: t
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch WRs (Trackmania.io) and TAS runs (TMTAS Exchange)
        if: github.event_name == 'schedule' || inputs.fetch
        run: node scripts/update.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract TAS inputs from replays (GBX.NET)
        env:
          DUMP_PROPS: '1'
        run: dotnet run --project tools/extract -c Release -- data/tas.json data/inputs
      - name: Commit data
        run: |
          git config user.name "kacky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F' '%H:%M)"
          git pull --rebase origin main
          git push

  deploy:
    needs: data
    # runs right away on push; after the data job on schedule / manual runs
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache-bust assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  # Keeps the 30-minute cycle going even when GitHub skips the cron schedule:
  # waits until 30 min after this run started, then starts the next run.
  # (Disable the workflow in the Actions tab to stop the cycle.)
  next:
    needs: [data, deploy]
    if: always() && github.event_name != 'push' && needs.data.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the 30-minute mark
        run: |
          elapsed=$(( $(date +%s) - ${{ needs.data.outputs.started }} ))
          wait=$(( 1800 - elapsed ))
          echo "elapsed ${elapsed}s, waiting ${wait}s"
          [ $wait -gt 0 ] && sleep $wait || true
      - name: Start next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo ${{ github.repository }} --ref main -f fetch=true
