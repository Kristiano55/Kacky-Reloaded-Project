name: Update data & deploy

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Refresh WRs and TAS runs. Untick to only extract inputs.'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # The 30-minute loop starts each run itself; the cron is only a fallback.
  # A scheduled run stands down if a refresh already ran in the last 25 minutes,
  # so the two never refresh at the same time.
  gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '25 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --repo ${{ github.repository }} --workflow update.yml --limit 20 --json databaseId,event,createdAt \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .event != \"push\" and .createdAt > \"$since\")] | length")
          if [ "$recent" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "a refresh ran recently, standing down"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  data:
    # Slow (Trackmania.io rate limits): only on schedule / manual runs
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      started: ${{ steps.t.outputs.started }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - id: t
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore run state (check times, TMTAS cursor)
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Fetch WRs (Trackmania.io) and TAS runs (TMTAS Exchange)
        if: github.event_name == 'schedule' || inputs.fetch
        run: node scripts/update.mjs
      - name: Any replays without extracted inputs?
        id: need
        run: |
          n=$(node -e "const fs=require('fs');const t=JSON.parse(fs.readFileSync('data/tas.json'));console.log(Object.values(t).flat().filter(r=>!fs.existsSync('data/inputs/'+r.id+'.txt')).length)")
          echo "missing=$n" >> "$GITHUB_OUTPUT"; echo "$n replays need inputs"
      - uses: actions/setup-dotnet@v6
        if: steps.need.outputs.missing != '0'
        with:
          dotnet-version: '8.0.x'
      - name: Extract TAS inputs from replays (GBX.NET)
        if: steps.need.outputs.missing != '0'
        run: dotnet run --project tools/extract -c Release -- data/tas.json data/inputs
      - name: Any maps without a card thumbnail?
        id: thumbs
        run: echo "missing=$(node -e "const fs=require('fs');console.log(require('./data/maps.json').filter(m=>m.thumb&&!fs.existsSync('thumbs/'+m.id+'.webp')).length)")" >> "$GITHUB_OUTPUT"
      - name: Make card thumbnails (640x180 WebP)
        if: steps.thumbs.outputs.missing != '0'
        run: pip install --quiet pillow && python3 scripts/thumbs.py
      - name: Read tags and videos from the Google Sheet
        run: node scripts/gsheet_sync.mjs
      - name: Save run state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .state
          key: state-${{ github.run_id }}
      - name: Commit data (only when records actually changed)
        id: commit
        run: |
          git config user.name "kacky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data thumbs 2>/dev/null || git add data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no data changes"; exit 0; fi
          echo "{\"at\":\"$(date -u +%FT%TZ)\"}" > data/updated.json && git add data/updated.json
          summary=$(git diff --cached --name-only | sed 's#data/##' | sed 's#inputs/.*#inputs#' | sort -u | paste -sd, -)
          git commit -m "data: $summary"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: data
    # runs right away on push; after the data job on schedule / manual runs
    if: always() && (github.event_name == 'push' || (needs.data.result == 'success' && needs.data.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check and test (a broken build never reaches the site)
        run: npm run -s check && npm run -s lint && npm test
      - name: Build share pages, sheet feeds and data/site.json
        run: node scripts/build_pages.mjs
      - name: Bundle and minify into _site/
        run: node scripts/bundle.mjs
      - name: Cache-bust assets
        working-directory: _site
        run: node ../scripts/cache_bust.mjs "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub's artifact API sometimes lags a few seconds behind the upload
      # ("No artifacts named github-pages were found"), so wait briefly and retry once.
      - run: sleep 10
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Keeps the 30-minute cycle going even when GitHub skips the cron schedule:
  # waits until 30 min after this run started, then starts the next run.
  # (Disable the workflow in the Actions tab to stop the cycle.)
  next:
    needs: [data, deploy]
    if: always() && (github.event_name == 'schedule' || inputs.fetch) && needs.data.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the 30-minute mark
        run: |
          elapsed=$(( $(date +%s) - ${{ needs.data.outputs.started }} ))
          wait=$(( 1800 - elapsed ))
          echo "elapsed ${elapsed}s, waiting ${wait}s"
          [ $wait -gt 0 ] && sleep $wait || true
      - name: Start next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only one refresh loop: skip if another run is already queued or running
          others=$(gh run list --repo ${{ github.repository }} --workflow update.yml --json databaseId,status,event \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .event != "push" and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting"))] | length')
          if [ "$others" -gt 0 ]; then echo "another refresh is already scheduled/running, not starting a new one"; exit 0; fi
          gh workflow run update.yml --repo ${{ github.repository }} --ref main -f fetch=true
